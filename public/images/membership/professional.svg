    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="0.6" stop-color="#25344d"/>
      <stop offset="1" stop-color="#5a6b85"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="80" cy="90" r="2"/><circle cx="190" cy="150" r="1.5"/><circle cx="320" cy="70" r="2"/>
    <circle cx="450" cy="130" r="1.5"/><circle cx="540" cy="60" r="2"/><circle cx="500" cy="220" r="1.5"/>
